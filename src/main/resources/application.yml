spring:
  application:
    name: bike-garage

  datasource:
    url: jdbc:h2:mem:bikegarage;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /

logging:
  config: classpath:logback-spring.xml
